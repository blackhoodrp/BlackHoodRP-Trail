name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Setup Godot
        uses: firebelley/setup-godot@v1.5
        with:
          godot-version: "4.2.1"
          use-dotnet: false
          export-templates: "true"

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/BlackHoodRP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: BlackHoodRP
          path: build/BlackHoodRP.apk
